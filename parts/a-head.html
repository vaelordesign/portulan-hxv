<title>Portulan HXV</title>
<meta name="description" content="Fiches, quiz et examen blanc pour l'Intra 1 du cours Histoire du monde depuis le XVe siècle (330-HXV-AG).">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#F1F4F4; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#15202D; --ink-2:#384556; --muted:#657184;
  --line:#D3DBDE; --line-2:#E6ECEE;
  --accent:#1D5A96; --accent-ink:#FFFFFF; --accent-soft:#E2ECF6; --accent-line:#B2C9E2;
  --sinopia:#9B3B2B; --sinopia-soft:#F6E6E1; --sinopia-line:#E2BFB5;
  --warm:#8F620E; --warm-soft:#F6EDD8; --warm-line:#E2CE9F;
  --verd:#2C7465; --verd-soft:#E1F0EC; --verd-line:#B2D6CD;
  --good:#2B7A4B; --good-soft:#E2F1E7; --bad:#B0382F; --bad-soft:#F9E4E1;
  --shadow:0 1px 2px rgba(18,32,45,.05),0 10px 28px rgba(18,32,45,.07);
  --f-display:"EB Garamond",Garamond,"Times New Roman",serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E141D; --surface:#151D29; --surface-2:#1A2331; --ink:#E6EAF0; --ink-2:#C3CAD4; --muted:#8D98A7;
    --line:#283344; --line-2:#1F2937;
    --accent:#86B2E6; --accent-ink:#0C1828; --accent-soft:#1B2A40; --accent-line:#324F77;
    --sinopia:#E79A86; --sinopia-soft:#35211C; --sinopia-line:#5E3429;
    --warm:#E0B058; --warm-soft:#312816; --warm-line:#584520;
    --verd:#6DC1AC; --verd-soft:#16302A; --verd-line:#28564B;
    --good:#72C08D; --good-soft:#1B2F23; --bad:#F0918A; --bad-soft:#3B2321;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#151D29; --surface-2:#1A2331; --ink:#E6EAF0; --ink-2:#C3CAD4; --muted:#8D98A7;
  --line:#283344; --line-2:#1F2937;
  --accent:#86B2E6; --accent-ink:#0C1828; --accent-soft:#1B2A40; --accent-line:#324F77;
  --sinopia:#E79A86; --sinopia-soft:#35211C; --sinopia-line:#5E3429;
  --warm:#E0B058; --warm-soft:#312816; --warm-line:#584520;
  --verd:#6DC1AC; --verd-soft:#16302A; --verd-line:#28564B;
  --good:#72C08D; --good-soft:#1B2F23; --bad:#F0918A; --bad-soft:#3B2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.58}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0 0 .9em}
ul,ol{margin:0 0 1em;padding-left:1.35em}
li{margin:.25em 0}
li::marker{color:var(--muted)}
strong,b{font-weight:600}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.ui{font-family:var(--f-ui)}
.eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.sc{font-variant:small-caps;letter-spacing:.03em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden,[hidden]{display:none!important}

/* ---------- barre du haut ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1220px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;color:var(--sinopia)}
.brand h1{font-size:28px;font-style:italic;font-weight:500;letter-spacing:.01em}
.brand .sub{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.03em;line-height:1.3}
.brand .sub b{color:var(--ink-2);font-weight:600}
.cd{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sinopia-soft);color:var(--sinopia);border:1px solid var(--sinopia-line);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;font-family:var(--f-ui);flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:7px 13px;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tab:hover{background:var(--line-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.22)}
.tab:not([aria-selected="true"]) .n{background:var(--line-2);color:var(--muted)}

/* ---------- fiches ---------- */
.view{display:none}
.view.on{display:block}
.wrap{max-width:1220px;margin:0 auto;padding:26px 20px 80px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;align-items:start}
.toc{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto;font-family:var(--f-ui);font-size:13.5px;padding-right:6px;scrollbar-width:thin}
.toc .part{margin:14px 0 6px;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.toc a{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);text-decoration:none;padding:5px 8px;border-radius:5px;line-height:1.3}
.toc a:hover{background:var(--line-2)}
.toc a.cur{background:var(--accent-soft);color:var(--accent);font-weight:500}
.toc a .num{color:var(--muted);font-size:11px;min-width:18px;font-variant-numeric:tabular-nums}
.toc a.done .num{color:var(--good)}
.toc a.done .num::after{content:" ✓"}
.toc-progress{margin:10px 8px 0;font-size:12px;color:var(--muted)}
.toc-progress .bar{height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden}
.toc-progress .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.btn.toc-btn{display:none}
.article{min-width:0;max-width:76ch}
.fiche{padding:44px 0 36px;border-top:1px solid var(--line)}
.fiche:first-child{border-top:0;padding-top:8px}
.fiche h2{font-size:40px;margin:6px 0 18px}
.fiche h3{font-size:25px;margin:32px 0 10px;color:var(--ink)}
.fiche h4{font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 8px}
.fiche p,.fiche li{max-width:72ch}
.lead{font-size:19px;color:var(--ink-2);line-height:1.5}
.sec-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;font-family:var(--f-ui)}
.btn{font-family:var(--f-ui);font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:7px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}

/* ---------- blocs de contenu ---------- */
.def,.retenir,.piege,.compl,.note,.src,.prof{margin:16px 0 20px;padding:14px 18px 12px;border-radius:6px;max-width:72ch}
.def{background:var(--surface);border:1px solid var(--line)}
.retenir{background:var(--accent-soft);border:1px solid var(--accent-line)}
.piege{background:var(--warm-soft);border:1px solid var(--warm-line)}
.compl{background:var(--verd-soft);border:1px dashed var(--verd-line);color:var(--ink-2)}
.note{background:var(--line-2)}
.src{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sinopia);border-radius:0 6px 6px 0}
.prof{background:var(--surface);border:1.5px solid var(--sinopia-line);box-shadow:var(--shadow)}
.blabel{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;display:block}
.def .blabel,.retenir .blabel{color:var(--accent)}
.piege .blabel{color:var(--warm)}
.compl .blabel{color:var(--verd)}
.note .blabel{color:var(--muted)}
.src .blabel,.prof .blabel{color:var(--sinopia)}
.def>:last-child,.retenir>:last-child,.piege>:last-child,.compl>:last-child,.note>:last-child,.src>:last-child,.prof>:last-child{margin-bottom:0}
.def .term{font-family:var(--f-display);font-size:24px;font-weight:500;display:block;margin-bottom:4px}
.def .who{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-left:6px;font-weight:500;letter-spacing:.02em}
.src .ref{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);display:block;margin-top:6px}
.src q,.src .quote{font-style:italic}
blockquote.cit{margin:18px 0 20px;padding:0 0 0 22px;border-left:2px solid var(--accent-line);font-style:italic;font-size:18px;color:var(--ink);max-width:66ch}
blockquote.cit cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:12px 0 18px;font-size:16px}
.kv dt{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}
.tbl-wrap{overflow-x:auto;margin:14px 0 22px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink-2)}
td.d,th.d{white-space:nowrap;font-family:var(--f-ui);font-size:13.5px;font-weight:600;color:var(--sinopia);font-variant-numeric:tabular-nums}
tr.hd td{background:var(--line-2);font-family:var(--f-ui);font-weight:600;font-size:13px;color:var(--ink-2);letter-spacing:.02em}
td a{font-family:var(--f-ui);font-size:13px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 20px}
.two .col{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface)}
.two .col h5{margin:0 0 8px;font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.two .col.alt h5{color:var(--sinopia)}
.two ul{margin:0;padding-left:1.1em;font-size:15.5px}
.two p{font-size:15.5px}
.persons{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0 22px}
.person{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px 20px 14px}
.person .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.person .ph h3{margin:0;font-size:27px}
.person .dates{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.person ul{margin:6px 0 0;font-size:15.5px}
.person p{font-size:15.5px;margin:.4em 0 0}
.pill{display:inline-block;font-family:var(--f-ui);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:2px 0 8px}
.pill.s{background:var(--sinopia-soft);color:var(--sinopia)}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 20px;max-width:72ch}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 44px;border-bottom:1px solid var(--line-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-ui);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.tl{list-style:none;padding:0;margin:12px 0 20px}
.tl li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:7px 0;border-bottom:1px solid var(--line-2);max-width:72ch}
.tl .d{font-family:var(--f-ui);font-size:13.5px;font-weight:600;color:var(--sinopia);font-variant-numeric:tabular-nums;padding-top:2px}
.chain{list-style:none;padding:0;margin:14px 0 22px;display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;font-family:var(--f-ui);font-size:13.5px}
.chain li{margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);position:relative;line-height:1.3;max-width:240px}
.chain li b{display:block;color:var(--accent);font-size:12px;letter-spacing:.04em}
.chain li:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.chain li:not(:last-child){margin-right:10px}
.modal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 6px;font-family:var(--f-ui);font-size:14px}
.modal div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.modal b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.grid-quotes{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0 20px}
.q-item{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface);font-size:15.5px}
.q-item i{display:block;font-style:italic;font-size:17px;margin-bottom:4px}
.q-item small{font-family:var(--f-ui);color:var(--muted);font-size:12.5px;display:block;margin-bottom:6px}
.tag{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--verd-soft);color:var(--verd);vertical-align:1px;white-space:nowrap}
.gl{margin:10px 0 20px}
.gl dt{font-family:var(--f-display);font-size:21px;font-weight:500;margin-top:14px}
.gl dt .who{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:8px;vertical-align:2px}
.gl dt .who.w{color:var(--muted)}
.gl dd{margin:2px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line-2);max-width:72ch}
.gl dd a{font-family:var(--f-ui);font-size:12.5px;margin-left:4px}

/* ---------- quiz ---------- */
.qwrap{max-width:800px;margin:0 auto;padding:28px 20px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 26px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h2{font-size:32px;margin-bottom:6px}
.card .lead{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{font-family:var(--f-ui);font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .cnt{color:var(--muted);font-weight:400;margin-left:4px}
.field{margin:8px 0 14px;font-family:var(--f-ui);font-size:14px}
.field label{display:block;font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select,textarea,input[type="text"]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:120px;font-family:var(--f-body);font-size:16px;line-height:1.5;resize:vertical}
input[type="text"]{width:100%;font-family:var(--f-body);font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:0 0 18px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.qtype{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--line-2);color:var(--ink-2)}
.qtext{font-size:21px;line-height:1.4;margin:6px 0 18px;text-wrap:pretty}
.passage{font-size:16.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin:4px 0 16px}
.passage p:last-child{margin-bottom:0}
.passage .ref{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:8px}
.opts{display:grid;gap:8px}
.opt{font-family:var(--f-ui);font-size:15.5px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px 11px 44px;cursor:pointer;position:relative;line-height:1.35}
.opt .k{position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;font-size:15.5px;border:1px solid var(--line)}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.ko{background:var(--bad-soft);border-color:var(--bad)}
.fb .blabel{margin-bottom:4px}
.fb.ok .blabel{color:var(--good)} .fb.ko .blabel{color:var(--bad)}
.fb p:last-child{margin-bottom:0}
.model{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:15.5px}
.model .blabel{color:var(--accent)}
.model ul,.model ol{margin-bottom:0}
.model p:last-child{margin-bottom:0}
.crit{margin:12px 0 0;padding:10px 14px;border:1px dashed var(--accent-line);border-radius:6px;background:var(--surface);font-family:var(--f-ui);font-size:13.5px}
.crit b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.crit ol{margin:0;padding-left:1.3em}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-family:var(--f-ui);font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--accent-line);color:var(--accent)}
.grade{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-family:var(--f-ui);align-items:center}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.score{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px}
.score div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-ui)}
.score b{display:block;font-size:32px;font-family:var(--f-display);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bygroup{list-style:none;padding:0;margin:0 0 18px;font-family:var(--f-ui);font-size:14px}
